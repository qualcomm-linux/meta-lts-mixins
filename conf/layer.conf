# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lts-connectivity-mixin"
BBFILE_PATTERN_lts-connectivity-mixin = "^${LAYERDIR}/"
BBFILE_PRIORITY_lts-connectivity-mixin = "6"

LAYERSERIES_COMPAT_lts-connectivity-mixin = "wrynose"

LAYERDEPENDS_lts-connectivity-mixin = " \
    core \
    openembedded-layer \
"
